<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search for images, spin the roulette, and keep your history.">
  <title>Tagspin — Image roulette</title>
  <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=2.1.0">
  <script type="module" src="./app.js?v=2.2.0"></script>
</head>
<body>
  <main>
    <header><h1>Tagspin</h1><a href="#history">History <span id="history-count">0</span></a></header>
    <p class="intro">Image roulette. Search, spin, repeat.</p>
    <form id="spin-form">
      <fieldset id="search-fields">
        <label class="tag-field">What images?<input id="tag" name="tag" placeholder="e.g. cats, rainy streets, abstract art" maxlength="100" required autocomplete="off"></label>
        <label class="count-field">How many?<input id="count" name="count" type="number" min="2" max="50" value="10" required></label>
        <label class="website-field">Website <span>(optional)</span><input id="website" name="website" placeholder="example.com" maxlength="200"></label>
        <button id="spin-button" type="submit">Spin</button>
      </fieldset>
    </form>
    <p id="status" role="status" aria-live="polite">Images from across the web.</p>
    <section id="result" class="result" aria-label="Roulette result" aria-busy="false">
      <p id="empty-result">Enter a tag to start.</p>
      <img id="result-image" alt="" referrerpolicy="no-referrer" hidden>
    </section>
    <div id="result-info" hidden><div><h2 id="result-title"></h2><p id="pool-count"></p></div><div class="result-actions"><a id="source-link" target="_blank" rel="noopener noreferrer">Source ↗</a><button id="spin-again" type="button">Spin again</button></div></div>
    <details id="history"><summary>History <span id="history-total">0</span></summary><div class="history-toolbar"><span>Saved in this browser.</span><button id="clear-history" class="plain-button" type="button" hidden>Clear</button></div><p id="empty-history">No spins yet.</p><div id="history-grid"></div></details>
  </main>
  <dialog id="clear-dialog"><h2>Clear history?</h2><p>This removes saved spins from this browser.</p><div class="dialog-actions"><button id="cancel-clear" type="button">Cancel</button><button id="confirm-clear" type="button">Clear</button></div></dialog>
</body>
</html>
